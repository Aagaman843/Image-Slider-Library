<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced JS Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container" id="image-slider">
        
        <div class="slider-track">
            <div class="slide"><img src="images/img1.jpg" alt="Slide 1"></div>
            <div class="slide"><img src="images/img2.jpg" alt="Slide 2"></div>
            <div class="slide"><img src="images/img3.jpg" alt="Slide 3"></div>
            <div class="slide"><img src="images/img4.jpg" alt="Slide 4"></div>
        </div>

        <button class="nav-btn prev" aria-label="Previous">&#10094;</button>
        <button class="nav-btn next" aria-label="Next">&#10095;</button>

        <div class="dots-container"></div>
    </div>

    <script src="slider.js"></script>
</body>
</html>
